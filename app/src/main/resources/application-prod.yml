# Railway Postgres. Tables already exist from the microservice Flyway histories.
# JDBC URL/user/password are set by RailwayDatabaseConfig from DATABASE_URL or PG*.
spring:
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 5
  mail:
    sender_email: ${SMTP_SENDER_EMAIL:noreply@example.com}
