# Local infrastructure for the modular monolith.
# App: mvn -pl app spring-boot:run  (dev profile, port 8080)
#
# Env: POSTGRES_DB=site_db POSTGRES_USER=postgres POSTGRES_PASSWORD=postgres

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: site_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d site_db"]
      interval: 5s
      timeout: 3s
      retries: 5
